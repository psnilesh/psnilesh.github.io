
name: Build and Deploy

on:
 push:
   branches: [ main, master ]

jobs:
 build:
   runs-on: ubuntu-latest

   steps:
   - uses: actions/checkout@v3

   # Node 24: jsdom (devDependency, used by the options calculator tests)
   # declares engines ^22.22.2 || ^24.15.0 || >=26, so npm install on 18
   # emits EBADENGINE warnings. Node 18 is also end-of-life.
   - name: Setup Node.js
     uses: actions/setup-node@v3
     with:
       node-version: '24'

   - name: Install dependencies
     run: npm install

   - name: Build site
     run: npm run build

   - name: Deploy to GitHub Pages
     uses: peaceiris/actions-gh-pages@v3
     with:
       github_token: ${{ secrets.GITHUB_TOKEN }}
       publish_dir: ./_site
